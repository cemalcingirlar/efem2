<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

<nav id="navbar">
  <div class="container">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-logo">
        <div class="logo-icon">📱</div>
        <div class="logo-text">
          <span class="logo-name" style="display:block;line-height:1">efem</span>
          <span class="logo-sub" style="display:block;line-height:1">iletişim</span>
        </div>
      </a>
      <div class="navbar-search">
        <div class="search-input-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-input" placeholder="Ürün ara..." autocomplete="off">
        </div>
        <div class="search-dropdown" id="search-dropdown"></div>
      </div>
      <nav class="navbar-nav">
        <a href="index.html" class="nav-link">Ana Sayfa</a>
        <a href="urunler.html" class="nav-link">Ürünler</a>
      </nav>
      <div class="navbar-actions">
        <a href="hesap.html" class="btn btn-ghost btn-sm" id="nav-login-link">👤 Giriş Yap</a>
        <div class="nav-dropdown hidden" id="nav-user-menu">
          <button class="btn btn-ghost btn-sm">👤 <span id="nav-user-name">Kullanıcı</span> ▾</button>
          <div class="nav-dropdown-menu">
            <a href="profil.html" class="nav-dropdown-item">📋 Profilim</a>
            <span class="nav-dropdown-item" onclick="logout()" style="color:var(--error)">🚪 Çıkış Yap</span>
          </div>
        </div>
        <a href="sepet.html" class="cart-btn" style="background:var(--secondary)">
          🛒 Sepet
          <span class="cart-badge" id="cart-badge-1" style="display:none">0</span>
        </a>
        <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
      </div>
    </div>
  </div>
</nav>

<div class="mobile-menu" id="mobile-menu">
  <a href="index.html" class="mobile-nav-link">🏠 Ana Sayfa</a>
  <a href="urunler.html" class="mobile-nav-link">🛍 Ürünler</a>
  <a href="hesap.html" class="mobile-nav-link">👤 Hesabım</a>
</div>

<main>
  <div class="page-header">
    <div class="container">
      <div class="breadcrumb" style="padding:0 0 var(--space-3)">
        <a href="index.html">🏠 Ana Sayfa</a>
        <span class="sep">›</span>
        <span class="current">Sepetim</span>
      </div>
      <h1>🛒 Alışveriş Sepetim</h1>
    </div>
  </div>

  <div class="container">
    <div class="cart-layout" id="cart-layout">
      <!-- JS ile doldurulur -->
    </div>
  </div>
</main>

<footer>
  <div class="container">
    <div class="footer-bottom">
      <span>© 2024 efemiletisim.com</span>
      <div class="footer-payment-icons">
        <span class="payment-icon">VISA</span>
        <span class="payment-icon">MC</span>
        <span class="payment-icon">🔒 SSL</span>
      </div>
    </div>
  </div>
</footer>

<div id="toast-container"></div>

<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script src="js/products.js"></script>
<script src="js/main.js"></script>
<script>
let appliedCoupon = null;
let couponDiscount = 0;

document.addEventListener('DOMContentLoaded', () => {
  renderCartPage();
});

function renderCartPage() {
  const cart = getCart();
  const layout = document.getElementById('cart-layout');

  if (cart.length === 0) {
    layout.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <div class="icon">🛒</div>
        <h3>Sepetiniz Boş</h3>
        <p>Henüz ürün eklemediniz. Harika ürünleri keşfedin!</p>
        <a href="urunler.html" class="btn btn-primary btn-lg">🛍 Alışverişe Başla</a>
      </div>`;
    return;
  }

  const subtotal = getCartSubtotal();
  const shipping = getShippingCost();
  const total    = getCartTotal(couponDiscount);

  layout.innerHTML = `
    <!-- Sol: Ürünler -->
    <div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-5)">
        <h2 style="font-size:1rem;color:var(--text-secondary)">${cart.length} ürün</h2>
        <button class="btn btn-ghost btn-sm" onclick="clearCart(); renderCartPage()"
                style="color:var(--error);border-color:var(--error)">
          🗑 Sepeti Temizle
        </button>
      </div>
      <div class="cart-items-list">
        ${cart.map(renderCartItem).join('')}
      </div>

      <!-- Alışverişe devam -->
      <div style="margin-top:var(--space-5)">
        <a href="urunler.html" class="btn btn-ghost">
          ← Alışverişe Devam Et
        </a>
      </div>
    </div>

    <!-- Sağ: Özet -->
    <div>
      <div class="price-summary">
        <h3>Sipariş Özeti</h3>

        <div class="price-row">
          <span class="label">Ara Toplam</span>
          <span>${formatPrice(subtotal)}</span>
        </div>
        <div class="price-row free">
          <span class="label">🚚 Kargo</span>
          <span>Ücretsiz</span>
        </div>
        ${appliedCoupon ? `
          <div class="price-row" style="color:var(--success)">
            <span class="label">🎟 Kupon (${appliedCoupon.coupon.label})</span>
            <span>-${formatPrice(couponDiscount)}</span>
          </div>` : ''}
        <div class="price-row total">
          <span>Toplam</span>
          <span style="color:var(--primary)">${formatPrice(total)}</span>
        </div>

        <!-- Kupon -->
        <div style="margin-top:var(--space-5)">
          <div style="font-size:0.875rem;font-weight:600;margin-bottom:var(--space-2)">🎟 Kupon Kodu</div>
          <div class="coupon-input-row">
            <input type="text" id="coupon-input" placeholder="Kod girin..." style="text-transform:uppercase">
            <button class="btn btn-secondary btn-sm" onclick="handleCoupon()">Uygula</button>
          </div>
          <div id="coupon-msg" style="font-size:0.8125rem;margin-top:var(--space-2)"></div>
          <div style="font-size:0.75rem;color:var(--text-muted);margin-top:var(--space-1)">
            Deneme: EFEMI10, EFEMI50, HOSGELDIN
          </div>
        </div>

        <a href="odeme.html" class="btn btn-primary btn-block btn-lg" style="margin-top:var(--space-5)">
          💳 Ödemeye Geç →
        </a>

        <!-- Güven rozetleri -->
        <div style="display:flex;justify-content:center;gap:var(--space-4);margin-top:var(--space-4);font-size:0.75rem;color:var(--text-muted)">
          <span>🔒 Güvenli Ödeme</span>
          <span>🚚 Ücretsiz Kargo</span>
          <span>↩️ 14 Gün İade</span>
        </div>
      </div>
    </div>
  `;

  // Event listener'ları yeniden bağla
  window.renderCartPage = renderCartPage;
}

function handleCoupon() {
  const code = document.getElementById('coupon-input')?.value || '';
  const result = applyCoupon(code);
  const msgEl  = document.getElementById('coupon-msg');

  if (result.valid) {
    appliedCoupon  = result;
    couponDiscount = result.discount;
    msgEl.style.color = 'var(--success)';
    msgEl.textContent = '✅ ' + result.msg;
    showToast(result.msg, 'success');
    renderCartPage();
  } else {
    msgEl.style.color = 'var(--error)';
    msgEl.textContent = '❌ ' + result.msg;
    showToast(result.msg, 'error');
  }
}
</script>
</body>
</html>
